<link rel="stylesheet" href="styles.css">
<style>
.leadership-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 32px;
  max-width: 100%;
  padding: 8vw;
  margin: 0;
}

.officer-card {
  position: relative;
  overflow: hidden;
  background: rgba(10, 10, 10, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  cursor: pointer;
  padding: 0;
  font: inherit;
  text-align: left;
  color: inherit;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  aspect-ratio: 1;
}

.officer-card:hover {
  transform: translateY(-8px);
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
}

.officer-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--pos, 50% 50%);
  filter: grayscale(1) brightness(0.8);
  transition: filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.officer-card:hover .officer-photo {
  filter: grayscale(0) brightness(1);
}

.officer-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.35) 45%, transparent 70%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px;
}

.officer-name {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.officer-info {
  z-index: 2;
}

.officer-role {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent, #22ff88);
  margin-bottom: 8px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.officer-major {
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.leadership-header {
  max-width: 100%;
  padding: 140px 8vw 0;
  margin: 0;
}

.leadership-header .section-title {
  text-align: center;
  margin-bottom: 24px;
}

.leadership-intro {
  max-width: 800px;
  margin: 0 auto 80px;
  text-align: center;
  font-size: clamp(16px, 2vw, 20px);
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.7);
  font-style: italic;
}

@media (max-width: 900px) {
  .leadership-grid {
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    padding: 8vw;
  }
}

@media (max-width: 600px) {
  .leadership-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 6vw;
  }

  .officer-role {
    font-size: 14px;
  }

  .officer-major {
    font-size: 11px;
  }

  .leadership-header {
    padding: 100px 6vw 0;
  }

  .leadership-intro {
    margin-bottom: 50px;
    font-size: 14px;
  }
}

.officer-modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
}
.officer-modal.is-open { display: flex; }
.officer-modal-box {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  width: min(820px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: #0a0a0a;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-top: 3px solid var(--accent, #22ff88);
  border-radius: 4px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
.officer-modal-box img {
  width: 100%;
  height: 100%;
  min-height: 320px;
  object-fit: cover;
  object-position: var(--pos, 50% 50%);
}
.officer-modal-body {
  padding: 40px 32px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}
.officer-modal-body h2 { font-size: 34px; margin: 0; color: #fff; }
.officer-modal-role {
  color: var(--accent, #22ff88);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-size: 14px;
  font-weight: 700;
}
.officer-modal-major {
  color: rgba(255, 255, 255, 0.7);
  font-size: 15px;
  margin-bottom: 20px;
}
.officer-modal-link {
  align-self: flex-start;
  padding: 10px 18px;
  border: 1px solid var(--accent, #22ff88);
  color: var(--accent, #22ff88);
  text-decoration: none;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
  transition: background 0.2s, color 0.2s;
}
.officer-modal-link:hover { background: var(--accent, #22ff88); color: #000; }
.officer-modal-close {
  position: absolute;
  top: 10px;
  right: 14px;
  background: rgba(0, 0, 0, 0.5);
  border: 0;
  color: #fff;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  z-index: 2;
}
@media (max-width: 600px) {
  .officer-modal-box { grid-template-columns: 1fr; }
  .officer-modal-box img { min-height: 0; aspect-ratio: 1; }
  .officer-modal-body { padding: 24px; }
}
</style>
</head>

<script src="script.js"></script>
<script>
(function () {
  var modal = document.getElementById('officer-modal');
  var box = modal.querySelector('.officer-modal-box');
  var last = null;
  function open(card) {
    last = card;
    var d = card.dataset;
    box.style.setProperty('--accent', card.style.getPropertyValue('--accent'));
    box.style.setProperty('--pos', d.pos);
    document.getElementById('om-photo').src = d.photo;
    document.getElementById('om-photo').alt = d.name;
    document.getElementById('om-name').textContent = d.name;
    document.getElementById('om-role').textContent = d.role;
    document.getElementById('om-major').textContent = d.major;
    document.getElementById('om-link').href = d.linkedin;
    modal.classList.add('is-open');
    document.getElementById('om-close').focus();
  }
  function close() {
    modal.classList.remove('is-open');
    if (last) last.focus();
  }
  document.querySelectorAll('.officer-card').forEach(function (c) {
    c.addEventListener('click', function () { open(c); });
  });
  document.getElementById('om-close').addEventListener('click', close);
  modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();
</script>
