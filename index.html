<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hacksu room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
/* concept: a dark basement room you can walk around. every object is a page; scroll for the rest of it. */
:root{
  --bg:#000; --fg:#fff; --ash:#c4c4c4; --muted:#757575; --line:#2a2a2a; --line2:#333;
  --accent:#ff4d00;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--fg)}
body{font-family:var(--font); font-variation-settings:'wdth' 118; font-weight:500; font-size:15px; line-height:1.15; letter-spacing:-0.01em; text-transform:lowercase; overflow-x:hidden}
.caps{text-transform:uppercase}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit}
#stage{position:fixed; inset:0; z-index:0; background:#030303}
#gl{width:100%; height:100%; display:block; touch-action:pan-y}
#bar{position:fixed; left:0; right:0; top:0; z-index:20; background:#000; border-bottom:1px solid var(--line); padding:10px max(12px, env(safe-area-inset-left)) 10px max(12px, env(safe-area-inset-right)); padding-top:calc(10px + env(safe-area-inset-top, 0px)); display:flex; align-items:center; justify-content:space-between; gap:16px}
#bar .logo{flex:1 1 0; font-size:20px; font-weight:800; letter-spacing:-0.03em; background:none; border:0; padding:0; cursor:pointer; text-align:left}
#bar nav{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 28px; font-size:13px; font-weight:600}
#bar nav a{padding:2px 0}
#bar nav a sup{color:var(--muted); font-size:9px; margin-left:3px}
#bar nav a.on, #bar nav a:hover{color:var(--accent)}
#bar .right{flex:1 1 0; display:flex; justify-content:flex-end; align-items:center; gap:18px; font-size:13px; font-weight:600}
#bar .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; margin-right:6px}
.swatches{display:flex; gap:6px; align-items:center}
.sw{width:13px; height:13px; padding:0; margin:0; border:1px solid #454545; border-radius:0; cursor:pointer}
.sw.on{border-color:#fff}
#hero{position:relative; z-index:1; height:100vh; height:100svh; min-height:560px; pointer-events:none}
#hero .ttl{position:absolute; left:max(12px, env(safe-area-inset-left)); bottom:64px; max-width:min(1100px, 92vw)}
#hero .eyebrow{margin:0 0 14px; font-size:13px; font-weight:600; color:var(--ash)}
#hero h1{margin:0; font-size:clamp(46px,8.2vw,128px); font-weight:700; line-height:.9; letter-spacing:-0.05em; color:#e6e6e6; text-shadow:0 2px 30px rgba(0,0,0,.85); text-wrap:balance}
#hero .sub{margin:18px 0 0; max-width:420px; font-size:16px; font-weight:600; color:#d4d4d4; text-shadow:0 1px 14px #000}
#hero .hint{position:absolute; right:max(12px, env(safe-area-inset-right)); bottom:20px; margin:0; font-size:12px; color:var(--ash); text-align:right; max-width:280px; text-shadow:0 1px 10px #000}
#hero .back{position:absolute; left:50%; transform:translateX(-50%); bottom:18px; pointer-events:auto; background:#000; border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; display:flex; gap:8px; align-items:center; white-space:nowrap}
#hero .back[hidden]{display:none}
#hero .back:hover{border-color:#fff}
#hero .ttl, #hero .hint{transition:opacity .35s}
#hero.swap .ttl, #hero.swap .hint{opacity:0}
#tip{position:fixed; z-index:30; pointer-events:none; background:#000; border:1px solid var(--accent); padding:5px 9px; font-size:13px; font-weight:700; opacity:0; transform:translate(14px,14px); transition:opacity .15s; white-space:nowrap}
#sheet{position:relative; z-index:2; background:#000; border-top:1px solid var(--line); padding-top:1px}
#sheet .wrap{padding:0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-right))}
.sec{margin-top:128px}
.lab{margin:0; font-size:20px; font-weight:600; letter-spacing:-0.02em; color:var(--muted)}
.hr{border-top:1px solid var(--line2); margin:14px 0 0}
.trio{display:flex; flex-wrap:wrap; gap:24px 12px; align-items:flex-start}
.trio>div{flex:1 1 33%; min-width:280px}
.trio>div:last-child{flex-basis:30%}
.big{margin:0; font-size:clamp(52px,7.4vw,112px); font-weight:700; line-height:.92; letter-spacing:-0.045em; color:#d4d4d4}
.big sup{font-size:.32em; color:var(--muted); margin-left:8px; vertical-align:top; position:relative; top:.15em}
.mid{margin:0; font-size:clamp(34px,4.6vw,66px); font-weight:700; line-height:.96; letter-spacing:-0.04em; color:#d4d4d4}
.stmt{margin:0; font-size:clamp(26px,3vw,44px); font-weight:700; line-height:1; letter-spacing:-0.035em; color:#d4d4d4}
.p{margin:0; font-size:15px; font-weight:600; line-height:1.18}
.ash{color:var(--ash)} .mut{color:var(--muted)}
.btn{display:inline-block; font-size:13px; font-weight:700; border:1px solid #e5e7eb; padding:5px 9px; background:none; cursor:pointer}
.btn.w{background:#fff; color:#000; border-color:#fff}
.btn:hover{opacity:.75}
.ph{aspect-ratio:var(--r,4/5); width:100%; background:repeating-linear-gradient(135deg,#0c0c0c 0 14px,#131313 14px 28px); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted)}
.grid{display:grid; border-top:1px solid var(--line); border-left:1px solid var(--line)}
.tile{border-right:1px solid var(--line); border-bottom:1px solid var(--line); transition:background .15s}
.tile:hover{background:#151515}
.logo-t{height:84px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted)}
.rowl{display:flex; flex-wrap:wrap; gap:8px 24px; padding:14px 0; border-top:1px solid var(--line2); align-items:baseline}
.feat{display:flex; flex-wrap:wrap; gap:16px 12px; padding:12px 0; border-bottom:1px solid var(--line2); align-items:stretch}
.feat .img{flex:0 0 55%; min-width:300px}
.feat .tx{flex:1 1 220px; max-width:380px; padding-right:12px; display:flex; flex-direction:column; gap:12px}
.feat .ti{flex:1 1 160px; min-height:180px; padding-right:12px; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; text-align:right}
.feat .ti b{font-size:clamp(24px,2.4vw,34px); font-weight:700; letter-spacing:-0.03em}
.feat .ti span{font-size:13px; font-weight:600; color:var(--ash); line-height:1.3}
.cells{display:flex; flex-wrap:wrap; gap:48px 12px}
.cells>div{flex:1 1 420px; min-width:0}
.sp{display:flex; justify-content:space-between; align-items:baseline; gap:16px}
.cat{background:none; border:0; padding:0; cursor:pointer; font-weight:700; font-size:13px}
.cat.on{color:var(--accent)}
.crew{display:flex; flex-wrap:wrap; border-top:1px solid var(--line); border-left:1px solid var(--line)}
.crew .tile{flex:1 1 16%; min-width:190px; padding:12px; display:flex; flex-direction:column; gap:12px}
.crew img{filter:grayscale(1); transition:filter .3s; cursor:pointer}
.crew .tile:hover img, .crew img:focus-visible{filter:none}
#ask{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.6)}
#ask[hidden]{display:none}
#ask .box{background:#000; border:1px solid var(--accent); padding:20px; max-width:360px; width:100%; display:flex; flex-direction:column; gap:16px}
.mas{columns:3 280px; column-gap:12px}
.note{border:1px dashed #454545; padding:20px; font-weight:600; color:var(--ash)}
.note a{color:var(--accent); text-decoration:underline}
footer{margin-top:160px; border-top:1px solid var(--line)}
footer .giant{margin:0; padding:12px 12px 0; font-size:clamp(70px,17.4vw,300px); font-weight:800; letter-spacing:-0.05em; line-height:.85; font-variation-settings:'wdth' 125; white-space:nowrap; overflow:hidden; text-transform:uppercase}
footer .cols{display:flex; flex-wrap:wrap; gap:48px 12px; padding:64px 12px 16px; align-items:flex-end}
footer .cols>div{flex:1 1 33%; min-width:260px}
footer .links{display:flex; flex-direction:column; font-size:clamp(34px,4.6vw,66px); font-weight:700; letter-spacing:-0.04em; line-height:1.02; color:#d4d4d4}
footer .links a{background:none; border:0; padding:0; text-align:left; cursor:pointer; font:inherit; letter-spacing:inherit; color:inherit; text-transform:lowercase}
footer .links a:hover{color:var(--accent)}
footer .links sup{font-size:14px; color:var(--muted); margin-left:4px}
footer .meta{display:flex; flex-direction:column; align-items:flex-end; text-align:right; gap:18px; font-size:13px; font-weight:600}
.input{display:block; background:#1a1a1a; border:1px solid #1a1a1a; padding:6px 8px; color:var(--muted)}
#nogl{display:none; position:absolute; inset:0; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--ash)}
@media (max-width:820px){
  #bar nav{order:3; flex-basis:100%; justify-content:flex-start; gap:2px 16px}
  #bar .logo{flex:0 0 auto}
  #bar .right .nx{display:none}
  #hero .hint{display:none}
  #hero .ttl{bottom:70px}
  .feat .img{flex-basis:100%}
  footer .meta{align-items:flex-start; text-align:left}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto !important} }
</style>

</head>
<body>
<div id="stage"><canvas id="gl" aria-label="interactive 3d room of the hacksu space. each object opens a page."></canvas><div id="nogl">the 3d room needs webgl. use the top bar to read every page.</div></div>

<header id="bar">
<button class="logo" data-go="about" aria-label="hacksu, back to the room">hacksu.</button>
<nav aria-label="Primary" id="nav"></nav>
<div class="right">
<a href="#" data-go="meetings" class="nx"><span class="dot"></span>next: [day]</a>
<a href="#" data-go="contact">contact us</a>
<span class="swatches" id="sws" role="group" aria-label="theme"></span>
</div>
</header>

<main>
<section id="hero">
<div class="ttl"><p class="eyebrow" id="eyebrow"></p><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
<p class="hint" id="hint">click anything in the room to go there, or use the top bar. scroll for more.</p>
<button class="back" id="backbtn" hidden>← back to the room</button>
</section>
<div id="sheet"><div class="wrap" id="content"></div><footer id="foot"></footer></div>
</main>
<div id="tip"></div>
<div id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="askq"><div class="box"><p class="stmt" id="askq" style="font-size:26px"></p><div style="display:flex;gap:8px"><button class="btn w" id="askyes">open linkedin ↗</button><button class="btn" id="askno">cancel</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
/* ---------- content ---------- */
var NAV = [['about','about',''],['leadership','leadership','6'],['partnerships','partnerships',''],['resources','resources',''],['gallery','gallery',''],['meetings','meetings','']];
var ph = function (label, r) { return '<div class="ph" style="--r:' + (r || '4 / 5') + '">[ ' + label + ' ]</div>'; };
var lab = function (t) { return '<p class="lab">' + t + '</p><div class="hr"></div>'; };
var go = function (k, t, cls) { return '<a href="#' + k + '" data-go="' + k + '" class="btn ' + (cls || '') + '">' + t + '</a>'; };
var cell = function (l, t) { return '<div>' + lab(l) + '<p class="stmt" style="margin-top:14px">' + t + '</p></div>'; };
var trio = function (a, b, c) { return '<div class="trio"><div>' + a + '</div><div>' + (b || '') + '</div><div>' + c + '</div></div>'; };
var feat = function (img, tx, ti, meta) { return '<div class="feat"><div class="img">' + img + '</div><div class="tx">' + tx + '</div><div class="ti"><b>' + ti + '</b><span>' + meta + '</span></div></div>'; };
var logos = function (n, cols) { var s = ''; for (var i = 0; i < n; i++) s += '<div class="tile logo-t">[ logo ]</div>'; return '<div class="grid" style="grid-template-columns:repeat(' + cols + ',1fr)">' + s + '</div>'; };
var CAPS = [['hackathons','our flagship builds. cross-major teams, real problems, working projects by the end of the weekend.'],['speaker nights','engineers and recruiters from top companies and our alumni connections talk shop and meet the room.'],['resume workshops','hands-on sessions to get your resume, portfolio, and pitch ready for internship and co-op season.'],['build & game nights','low-key sessions to work on your own thing, get unstuck, or just hang out. no pressure, no agenda.']];
var caps = function () { return '<div class="cells">' + CAPS.map(function (c) { return cell(c[0], c[1]); }).join('') + '</div>'; };
var nextCard = function () {
  return feat(ph('event flyer · 16:10', '16 / 10'),
    '<span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700"><span class="dot" style="margin:0"></span>upcoming</span><p class="p">[one-line description of what happens and who it is for.]</p><div style="display:flex;gap:8px;margin-top:8px"><a href="#" class="btn w">rsvp</a><a href="#" class="btn">add to calendar</a></div>',
    '[event name]', '[month dd, yyyy] at [time]<br>[building · room]');
};
var OFFICERS = [['sanjay','president','cs + math','https://www.linkedin.com/in/sanjayrv'],['akshat','vice president','cpe','https://www.linkedin.com/in/sai-akshat-chitta/'],['prannav','secretary','me','https://www.linkedin.com/in/saiprannavmurali/'],['alex','head of marketing','cpe','https://www.linkedin.com/in/alexander-rostovtsev-941ab938a/'],['amrit','reservation delegate','isye','https://www.linkedin.com/in/amrit-sarangi-758019316/'],['ishika','treasurer','isye','https://www.linkedin.com/in/ishikav18/']];
var EVENTS = [['hackathon'],['speaker night'],['workshop'],['build night'],['hackathon'],['speaker night'],['workshop']];
var filter = 'all';
var eventList = function () {
  var cats = ['all','hackathon','speaker night','workshop','build night'];
  var rows = EVENTS.filter(function (e) { return filter === 'all' || e[0] === filter; });
  return '<div class="sp"><h2 class="big" style="font-size:clamp(40px,5vw,72px);color:#c4c4c4">more meetings</h2><span class="big" style="font-size:clamp(40px,5vw,72px);color:var(--muted)">' + rows.length + '</span></div><div class="hr" style="margin-bottom:16px"></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-bottom:16px;font-size:13px;font-weight:700"><span class="mut">categories</span>' +
    cats.map(function (c) { return '<button class="cat' + (c === filter ? ' on' : '') + '" data-filter="' + c + '">' + c + '</button>'; }).join('') + '</div>' +
    rows.map(function (e) { return '<a href="#" class="rowl tile" style="border-right:0"><span class="mut" style="flex:1 1 120px;font-weight:600">[mon dd]</span><span style="flex:3 1 320px;font-size:24px;font-weight:700;letter-spacing:-0.03em">[event name]</span><span class="ash" style="flex:1 1 160px;text-align:right;font-weight:600">' + e[0] + '</span></a>'; }).join('') + '<div class="hr" style="margin:0"></div>';
};

var PAGES = {
  home: {
    eyebrow: 'kennesaw state university', h1: 'a builder collective & hackathon crew making cool stuff that ships',
    sub: "we're the cross-major builders at ksu. hackathons, speaker nights, resume workshops, and real projects. beginners welcome.",
    html: function () {
      var b = ''; for (var i = 0; i < 3; i++) b += feat(ph('project image · 16:10', '16 / 10'), '<p class="p">[one or two sentences on what the team built, who it was for, and how it went at the hackathon.]</p>', '[project name]', '[hackathon · year]<br>[tag] · [tag]');
      return '<div class="sec">' + lab('next up') + nextCard() + '</div>' +
        '<div class="sec"><p class="lab" style="margin:0 0 20px 24%;font-size:24px">backed by builders</p>' + logos(18, 6) + '</div>' +
        '<div class="sec"><h2 class="big" style="font-size:clamp(48px,6vw,88px);color:#c4c4c4">featured builds</h2><div class="hr"></div>' + b + '</div>' +
        '<div class="sec"><p class="lab" style="font-size:15px;margin-bottom:12px">what we do</p><h2 class="big" style="font-size:clamp(38px,6vw,88px)">we\'re here to build the extraordinary. no shortcuts, just bold, hands-on work that ships and leaves a mark.</h2></div>' +
        '<div class="sec">' + caps() + '</div>';
    }
  },
  about: {
    eyebrow: 'the shelves', h1: 'about', sub: 'a place to turn curiosity into craft, and ideas into things that ship. from first-timers to seasoned builders.',
    html: function () {
      var w = ''; for (var i = 0; i < 6; i++) w += '<div class="rowl tile" style="border-right:0;font-weight:600"><span style="flex:1 1 200px">[placement / award]</span><span class="ash" style="flex:1 1 200px">[event]</span><span class="mut" style="flex:0 0 100px;text-align:right">[mon yyyy]</span></div>';
      return '<div class="sec" style="margin-top:96px">' + trio('<h2 class="big">mission</h2>', ph('group photo · portrait', '3 / 4'), '<p class="p">we exist so no builder at ksu has to figure it out alone. real projects, real connections, and a community that ships together.</p>') + '</div>' +
        '<div class="sec">' + lab('what we do') + '<div style="height:24px"></div>' + caps() + '</div>' +
        '<div class="sec">' + lab('why we exist') + '<div style="height:20px"></div>' + trio('<p class="mid">ksu never had a real home for the people building across majors.</p>', '', '<p class="p">hacksu is that home. a think tank where different skill sets collide to build things that actually ship, and a way to connect current students with alumni and industry so those projects turn into real opportunities. beginners welcome. you don\'t need a team or an idea to show up.</p>') + '</div>' +
        '<div class="sec">' + lab('how it works') + '<div style="height:20px"></div><div class="cells">' + [['show up','come to a build night, speaker night or workshop. no pressure, no agenda.'],['team up','join a cross-major team at a hackathon. real problems, a working project by the end of the weekend.'],['ship it','take it further with alumni and industry connections that turn projects into real opportunities.']].map(function (s) { return cell(s[0], s[1]); }).join('') + '</div></div>' +
        '<div class="sec" style="display:flex;flex-wrap:wrap;gap:24px 12px"><div style="flex:0 0 160px">' + ph('headshot', '1 / 1') + '</div><div style="flex:1 1 480px;max-width:900px;display:flex;flex-direction:column;gap:16px"><p class="mid" style="font-size:clamp(28px,3.6vw,54px)">"[a line from a sponsor, alum, or advisor about what hacksu does.]"</p><p class="mut p">[name], [role]</p></div></div>' +
        '<div class="sec"><div class="sp"><h2 class="big" style="font-size:clamp(40px,5vw,72px);color:#c4c4c4">wins</h2><span class="big" style="font-size:clamp(40px,5vw,72px);color:var(--muted)">x[n]</span></div><div class="hr" style="margin-bottom:12px"></div>' + w + '</div>' +
        '<div class="sec">' + lab('who we are') + '<div style="height:20px"></div>' + trio('<p class="mid">who runs this club, and who backs it</p>', '', '<p class="p" style="margin-bottom:16px">come meet our officer team and learn more about who runs this club, or see who backs us.</p><div style="display:flex;gap:8px;flex-wrap:wrap">' + go('leadership', 'officer team →', 'w') + go('partnerships', 'sponsors & partners →') + '</div>') + '</div>';
    }
  },
  leadership: {
    eyebrow: 'the lounge', h1: 'leadership<sup style="font-size:.28em;color:#757575;margin-left:10px;vertical-align:top">6</sup>', sub: "the students and organizers behind hacksu's hackathons, speaker nights, and community.",
    html: function () {
      var vals = [['every major, every level', "beginners welcome. you don't need a team or an idea to show up. cs, engineering, business, design: if you build, you belong here."],['ship it together','we team up across majors at hackathons and finish with working projects. we enjoy the grind, the humor, and the demo at the end.'],['no one figures it out alone','real projects, real connections, and a community that ships together. we ask for help when we need it.']];
      var v = vals.map(function (x) { return '<div style="margin-top:16px;border-bottom:1px solid var(--line2);padding-bottom:16px">' + trio('<p class="mid" style="font-size:clamp(36px,5vw,76px)">' + x[0] + '</p>', ph('image · b&w', '1 / 1'), '<p class="p">' + x[1] + '</p>') + '</div>'; }).join('');
      var crew = OFFICERS.map(function (o, i) { return '<div class="tile" id="off-' + i + '">' + '<img src="img/' + o[0] + '.jpg" alt="' + o[0] + '" data-li="' + i + '" tabindex="0" role="button" aria-label="open ' + o[0] + '\'s linkedin" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block">' + '<div><div class="caps" style="font-size:18px;font-weight:700;letter-spacing:-0.03em">' + o[0] + '</div><div class="ash" style="font-size:13px;font-weight:600;margin-top:4px">' + o[1] + ' · ' + o[2] + '</div></div></div>'; }).join('');
      return '<div class="sec" style="margin-top:96px">' + lab('our values') + v + '</div>' +
        '<div class="sec"><div class="sp"><h2 class="big" style="font-size:clamp(56px,8vw,120px)">the crew</h2><span class="big" style="font-size:clamp(56px,8vw,120px);color:var(--muted)">6</span></div><div class="hr" style="margin-bottom:24px"></div><div class="crew">' + crew + '</div></div>' +
        '<div class="sec">' + lab('advisor') + '<div style="height:20px"></div>' + trio('<p class="mid caps" style="font-size:clamp(36px,5vw,76px)">harshita nirujogi</p>', ph('advisor photo', '4 / 5'), '<p class="p" style="margin-bottom:12px">faculty advisor · computer science department</p><p class="p ash">[one or two sentences on how the advisor supports hacksu.]</p>') + '</div>' +
        '<div class="sec">' + lab('join the crew') + '<div style="height:20px"></div>' + trio('<p class="mid">curious? driven? come build with us.</p>', '', '<p class="p">come to a meeting, find your people, and build something with us. [officer applications / how to get involved.]</p><div style="display:flex;gap:8px;margin-top:16px">' + go('meetings', 'see meetings →', 'w') + '<a href="#" class="btn">join discord</a></div>') + '</div>';
    }
  },
